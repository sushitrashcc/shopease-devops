# Practical 8 - Blue-Green: namespace + the two Services.
#  shopease-live    (NodePort 30081) -> receives ALL production traffic; selector.color decides blue or green
#  shopease-preview (NodePort 30091) -> points at the idle colour so the new release can be tested before switch
apiVersion: v1
kind: Namespace
metadata:
  name: shopease-bg
---
apiVersion: v1
kind: Service
metadata:
  name: shopease-live
  namespace: shopease-bg
  labels: { role: live }
spec:
  type: NodePort
  selector: { app: shopease, color: blue }
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: shopease-preview
  namespace: shopease-bg
  labels: { role: preview }
spec:
  type: NodePort
  selector: { app: shopease, color: green }
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30091
