# Practical 7 - ShopEase deployed by the Jenkins CI/CD pipeline
apiVersion: v1
kind: Namespace
metadata:
  name: shopease
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopease
  namespace: shopease
  labels: { app: shopease }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: shopease }
  template:
    metadata:
      labels: { app: shopease }
    spec:
      containers:
        - name: web
          image: localhost:5000/shopease:latest   # Jenkins replaces this with the build tag
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shopease
  namespace: shopease
spec:
  type: NodePort
  selector: { app: shopease }
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
