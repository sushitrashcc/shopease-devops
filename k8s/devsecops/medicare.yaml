# Practical 9 - hardened deployment of the MediCare+ patient records API.
# Pod Security Admission "restricted" is ENFORCED on the namespace, so any insecure pod is rejected by the API server.
apiVersion: v1
kind: Namespace
metadata:
  name: medicare
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medicare-api
  namespace: medicare
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-api
  namespace: medicare
  labels: { app: medicare-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: medicare-api }
  template:
    metadata:
      labels: { app: medicare-api }
    spec:
      serviceAccountName: medicare-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: localhost:5000/medicare-api:latest   # replaced by Jenkins with the scanned image tag
          imagePullPolicy: Always
          ports: [{ containerPort: 3000 }]
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef: { name: medicare-secrets, key: API_KEY }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medicare-api
  namespace: medicare
spec:
  type: NodePort
  selector: { app: medicare-api }
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30082
---
# Zero-trust networking: deny everything by default ...
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: medicare
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# ... then allow only HTTP traffic to the API on port 3000 (no outbound access at all)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: medicare
spec:
  podSelector:
    matchLabels: { app: medicare-api }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 3000 }
